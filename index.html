<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALERIO Clinic Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100vh; }
.app-root { min-height: 100vh; }
.hidden { display: none !important; }

/* HOME */
body.view-home {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --text: #1a1a1a;
  --muted: #626262;
  --line: rgba(0, 0, 0, 0.08);
  --brand: #642667;
  --brand-dark: #57195a;
  --brand-deep: #510040;
  font-family: Poppins, system-ui, sans-serif;
  color: var(--text);
  background:
    radial-gradient(900px 420px at 85% -10%, color-mix(in srgb, var(--brand) 18%, white), transparent 60%),
    radial-gradient(700px 380px at 0% 100%, color-mix(in srgb, var(--brand-deep) 10%, white), transparent 55%),
    var(--bg);
}

    * { box-sizing: border-box; }header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 1rem 1.25rem;
    }
    .brand-row {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .mark {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 0.55rem;
      background: linear-gradient(145deg, var(--brand), var(--brand-deep));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .brand-name {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
    }
    .brand-sub {
      color: var(--muted);
      font-size: 0.82rem;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3.5rem;
    }
    h1 {
      margin: 0 0 0.45rem;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 600;
      line-height: 1.2;
    }
    .lede {
      margin: 0 0 2rem;
      max-width: 38rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .routes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 1rem;
    }
    a.route {
      display: flex;
      flex-direction: column;
      height: 100%;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.35rem 1.3rem 1.4rem;
      box-shadow: 0 10px 30px rgba(1, 7, 39, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    a.route:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--brand) 35%, var(--line));
      box-shadow: 0 16px 36px rgba(100, 38, 103, 0.14);
    }
    .eyebrow {
      color: var(--brand);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }
    .route h2 {
      margin: 0 0 0.45rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .route p {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      flex: 1 1 auto;
    }
    .cta {
      display: inline-block;
      align-self: flex-start;
      margin-top: auto;
      background: var(--brand);
      color: #ffffff;
      padding: 0.65rem 1rem;
      border-radius: 5px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    a.route:hover .cta { background: var(--brand-dark); }
  

/* DENTIST */

    body.view-dentist {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #626262;
      --line: rgba(0, 0, 0, 0.08);
      --brand: #642667;
      --brand-dark: #57195a;
      --brand-deep: #510040;
      --ok: #2f9e6b;
      --bad: #c44747;
      --warn: #b8860b;
    }
    * { box-sizing: border-box; }
body.view-dentist {
      margin: 0;
      min-height: 100vh;
      font-family: Poppins, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    header.app-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 0.85rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .app-bar-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: inherit;
    }
    .mark {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 0.5rem;
      background: linear-gradient(145deg, var(--brand), var(--brand-deep));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .brand strong { display: block; font-size: 0.95rem; letter-spacing: 0.04em; }
    .brand span { color: var(--muted); font-size: 0.78rem; }
    .who {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .who strong { color: var(--text); font-weight: 600; }
    .breadcrumbs {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem 0.15rem;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .breadcrumbs button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--brand);
      font: inherit;
      font-weight: 500;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .breadcrumbs button:hover {
      background: color-mix(in srgb, var(--brand) 8%, white);
      color: var(--brand-dark);
    }
    .breadcrumbs .crumb-current {
      color: var(--text);
      font-weight: 600;
      padding: 0.15rem 0.35rem;
    }
    .breadcrumbs .crumb-sep {
      color: #9aa0a6;
      padding: 0 0.1rem;
      user-select: none;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .screen.hidden { display: none; }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.7rem;
      font-weight: 600;
    }
    h2 {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      font-weight: 600;
    }
    .lede {
      margin: 0 0 1.4rem;
      color: var(--muted);
      line-height: 1.5;
      max-width: 40rem;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      box-shadow: 0 10px 28px rgba(1, 7, 39, 0.05);
      margin-bottom: 1rem;
    }
    .grid-dentists {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 0.85rem;
    }
    button, .btn {
      appearance: none;
      border: 1px solid #c9ced3;
      background: #fff;
      color: #1a1a1a;
      font: inherit;
      border-radius: 5px;
      padding: 0.75rem 1.05rem;
      cursor: pointer;
      font-weight: 500;
    }
    button.primary, .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
      font-weight: 600;
    }
    button.primary:hover, .btn.primary:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
      color: #ffffff;
    }
    .btn-new-patient {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 2.85rem;
      padding: 0.75rem 1.2rem;
      font-size: 1rem;
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--brand) 28%, transparent);
    }
    .btn-new-patient:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
      color: #ffffff;
    }
    .btn-new-patient .btn-plus {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1;
    }
    button.danger {
      background: #fff;
      border-color: #e0a0a0;
      color: #9b1c1c;
      font-weight: 600;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .action-banner {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      padding: 0.95rem 1.05rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(1, 7, 39, 0.04);
    }
    .action-banner p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
      max-width: 36rem;
    }
    .action-banner .primary {
      min-height: 2.85rem;
      padding-left: 1.25rem;
      padding-right: 1.25rem;
      font-size: 1rem;
    }
    .dentist-card {
      text-align: left;
      width: 100%;
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fafafa;
      display: flex;
      gap: 0.85rem;
      align-items: center;
    }
    .dentist-card:hover {
      border-color: color-mix(in srgb, var(--brand) 40%, var(--line));
      background: #fff;
    }
    .dentist-card .title {
      color: var(--brand);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }
    .dentist-card .name { font-weight: 600; font-size: 1.05rem; color: #1a1a1a; }
    .avatar {
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #e8e8e8;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px var(--line);
    }
    .avatar.lg {
      width: 4.25rem;
      height: 4.25rem;
    }
    .avatar.sm {
      width: 2.35rem;
      height: 2.35rem;
    }
    .person-heading {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .patient-name {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 500;
      color: #1a1a1a;
    }
    .gender-field {
      margin-bottom: 0.85rem;
    }
    .gender-options {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .gender-options label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0;
      font-weight: 500;
      border: 1px solid #c9ced3;
      border-radius: 5px;
      padding: 0.65rem 0.9rem;
      cursor: pointer;
      background: #fff;
      color: #1a1a1a;
    }
    .gender-options input {
      margin: 0;
      accent-color: var(--brand);
    }
    .gender-options label:has(input:checked) {
      border-color: var(--brand);
      background: color-mix(in srgb, var(--brand) 8%, white);
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }
    .toolbar .left, .toolbar .right {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.85rem;
      height: 2.85rem;
      padding: 0;
      border-radius: 8px;
      color: var(--brand);
      flex-shrink: 0;
    }
    .btn-back:hover {
      background: color-mix(in srgb, var(--brand) 8%, white);
      border-color: color-mix(in srgb, var(--brand) 40%, #c9ced3);
      color: var(--brand-dark);
    }
    .btn-back-icon {
      width: 1.45rem;
      height: 1.45rem;
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    th, td {
      text-align: left;
      padding: 0.7rem 0.55rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr.patient-row { cursor: pointer; }
    tr.patient-row:hover { background: color-mix(in srgb, var(--brand) 5%, white); }
    .muted { color: var(--muted); }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    input[type="text"],
    input[type="tel"],
    textarea {
      width: 100%;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 0.7rem 0.8rem;
      font: inherit;
      background: #fff;
      color: var(--text);
      margin-bottom: 0.85rem;
      box-sizing: border-box;
    }
    textarea { min-height: 7rem; resize: vertical; }
    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }
    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0 0 1rem;
    }
    .chip {
      background: color-mix(in srgb, var(--brand) 8%, white);
      color: var(--brand-deep);
      border: 1px solid color-mix(in srgb, var(--brand) 18%, var(--line));
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .visit-list {
      display: grid;
      gap: 0.55rem;
    }
    .visit-item {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 0.85rem 0.95rem;
      border: 1px solid #c9ced3;
      border-radius: 8px;
      background: #fafafa;
    }
    .visit-item:hover {
      background: #fff;
      border-color: color-mix(in srgb, var(--brand) 35%, #c9ced3);
    }
    .scan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
      gap: 0.85rem;
    }
    .scan-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #111;
    }
    .scan-card img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 18rem;
      object-fit: contain;
      background: #000;
    }
    .scan-card .foot {
      background: var(--surface);
      padding: 0.7rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .scan-card .foot .when {
      color: var(--muted);
      font-size: 0.8rem;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(25, 37, 48, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .overlay.hidden { display: none; }
    .overlay-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.4rem 1.5rem;
      min-width: min(20rem, 100%);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }
    .overlay-card.info {
      text-align: left;
      max-width: 22rem;
      width: 100%;
    }
    .overlay-card.info h3 {
      margin: 0 0 0.55rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--brand);
    }
    .overlay-card.info p {
      margin: 0 0 1.1rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .overlay-card.info .form-actions {
      margin: 0;
      justify-content: flex-end;
    }
    #appDialog { z-index: 80; }
    #appDialog .overlay-card.info { max-width: 28rem; }
    #appDialog p { white-space: pre-line; }
    #appDialog.tone-error h3 { color: var(--bad, #b42318); }
    #appDialog.tone-warn h3 { color: var(--warn, #b54708); }
    #appDialog button {
      appearance: none;
      border: 1px solid #c9ced3;
      background: #fff;
      color: #1a1a1a;
      padding: 0.65rem 0.95rem;
      border-radius: 5px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    #appDialog button.primary {
      background: var(--brand, #642667);
      border-color: var(--brand, #642667);
      color: #fff;
      font-weight: 600;
    }
    #appDialog button.danger {
      background: #fff;
      border-color: #e0a0a0;
      color: #9b1c1c;
      font-weight: 600;
    }
    .spinner {
      width: 2rem;
      height: 2rem;
      margin: 0 auto 0.85rem;
      border: 3px solid color-mix(in srgb, var(--brand) 25%, white);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tooth-spinner {
      width: 4.4rem;
      height: 5.2rem;
      margin: 0 auto 0.9rem;
      display: block;
      color: var(--brand);
    }
    .tooth-spinner path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tooth-spinner .tooth-guide {
      opacity: 0.18;
    }
    .tooth-spinner .tooth-draw {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: toothDraw 1.8s ease-in-out infinite;
    }
    @keyframes toothDraw {
      0% { stroke-dashoffset: 100; opacity: 1; }
      62% { stroke-dashoffset: 0; opacity: 1; }
      82% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tooth-spinner .tooth-draw {
        animation: none;
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 50;
      background: #1a1a1a;
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      max-width: 22rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .toast.hidden { display: none; }
    .toast.bad { background: var(--bad); }
    .toast.ok { background: var(--ok); }
    .empty {
      color: var(--muted);
      padding: 0.75rem 0;
      font-size: 0.92rem;
    }
  

/* HAMAMATSU — Alerio theme (matches Dentist) */
body.view-hamamatsu {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --panel: #ffffff;
  --text: #1a1a1a;
  --muted: #626262;
  --line: rgba(0, 0, 0, 0.08);
  --brand: #642667;
  --brand-dark: #57195a;
  --brand-deep: #510040;
  --accent: #642667;
  --ok: #2f7d4a;
  --bad: #b42318;
  --warn: #b54708;
  margin: 0;
  font-family: Poppins, system-ui, sans-serif;
  color: var(--text);
  min-height: 100vh;
  background:
    radial-gradient(900px 420px at 85% -10%, color-mix(in srgb, var(--brand) 18%, white), transparent 60%),
    radial-gradient(700px 380px at 0% 100%, color-mix(in srgb, var(--brand-deep) 10%, white), transparent 55%),
    var(--bg);
}
body.view-hamamatsu main {
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1.25rem 3rem;
}
body.view-hamamatsu h1 {
  font-family: inherit;
  font-weight: 600;
  font-size: 1.8rem;
  margin: 0 0 0.35rem;
  letter-spacing: -0.02em;
  color: var(--text);
}
body.view-hamamatsu .lede {
  color: var(--muted);
  margin: 0 0 1.35rem;
  max-width: 44rem;
  line-height: 1.45;
}
body.view-hamamatsu .row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-bottom: 0.85rem;
  align-items: center;
}
body.view-hamamatsu button,
body.view-hamamatsu .file-btn {
  appearance: none;
  border: 1px solid #c9ced3;
  background: #fff;
  color: var(--text);
  padding: 0.65rem 0.95rem;
  border-radius: 5px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}
body.view-hamamatsu button.primary,
body.view-hamamatsu .file-btn.primary {
  background: var(--brand);

      <header>
        <h2 id="explainTitle">Calibration algorithm</h2>
        <button id="btnCloseExplain" type="button">Close</button>
      </header>
      <p>
        This tool applies Hamamatsu-style flat-panel correction in two stages:
        dark subtraction, then shading (flat-field) correction. All four inputs
        are 1000×1506 little-endian uint16 images after a 16-byte file prefix.
      </p>

      <h3>1. Input frames</h3>
      <ul>
        <li><strong>Idr</strong> — dark frame for the open-beam reference (X-rays off).</li>
        <li><strong>Ido</strong> — dark frame for the object exposure (X-rays off).</li>
        <li><strong>Ixr</strong> — open-beam X-ray reference (no object).</li>
        <li><strong>Ixo</strong> — object X-ray exposure (phantom in the beam).</li>
      </ul>

      <h3>2. Dark correction</h3>
      <p>
        Remove detector offset from each X-ray image by subtracting its paired
        dark frame. Negative results are clamped to zero:
      </p>
      <div class="formula">Icdr = max(Ixr − Idr, 0)</div>
      <div class="formula">Icdo = max(Ixo − Ido, 0)</div>
      <p>
        <strong>Icdr</strong> is the dark-corrected reference;
        <strong>Icdo</strong> is the dark-corrected object image.
      </p>

      <h3>3. Shading / flat-field correction</h3>
      <p>
        Normalize the object image by the open-beam response so detector gain
        variation is removed. First compute a scaling constant
        <strong>C</strong> as the mean of usable reference pixels
        (Icdr &gt; 1):
      </p>
      <div class="formula">C = mean( Icdr<sub>i</sub> )  for all i where Icdr<sub>i</sub> &gt; 1</div>
      <p>Then form the final shaded image pixel-wise:</p>
      <div class="formula">Ics<sub>i</sub> = C × Icdo<sub>i</sub> / Icdr<sub>i</sub>   if Icdr<sub>i</sub> &gt; 1, else 0</div>
      <p>
        <strong>Ics</strong> is the final corrected radiograph shown by default
        on the results screen. Intermediate frames (raw and dark-corrected) are
        available there if you want to inspect each step.
      </p>

/** In-app confirm and error dialog shared by both demos. */
(function (global) {
  const queue = [];
  let active = null;

  function nodes() {
    return {
      root: document.getElementById("appDialog"),
      title: document.getElementById("appDialogTitle"),
      message: document.getElementById("appDialogMessage"),
      cancel: document.getElementById("appDialogCancel"),
      confirm: document.getElementById("appDialogConfirm"),
    };
  }

  function finish(result) {
    const current = active;
    if (!current) return;
    active = null;
    const ui = nodes();
    ui.root.classList.add("hidden");
    ui.root.setAttribute("aria-hidden", "true");
    current.resolve(result);
    const next = queue.shift();
    if (next) show(next);
  }

  function show(job) {
    active = job;
    const ui = nodes();
    ui.title.textContent = job.title;
    ui.message.textContent = job.message;
    ui.root.classList.remove("tone-error", "tone-warn");
    if (job.tone) ui.root.classList.add("tone-" + job.tone);
    ui.confirm.textContent = job.confirmLabel;
    ui.confirm.classList.toggle("danger", !!job.danger);
    ui.confirm.classList.toggle("primary", !job.danger);
    ui.cancel.textContent = job.cancelLabel || "Cancel";
    ui.cancel.classList.toggle("hidden", !job.cancelLabel);
    ui.root.classList.remove("hidden");
    ui.root.setAttribute("aria-hidden", "false");
    (job.cancelLabel ? ui.cancel : ui.confirm).focus();
  }

  function enqueue(job) {
    return new Promise((resolve) => {
      job.resolve = resolve;
      if (active) queue.push(job);
      else show(job);
    });
  }

  const ui = nodes();
  ui.confirm.addEventListener("click", () => finish(true));
  ui.cancel.addEventListener("click", () => finish(false));
  ui.root.addEventListener("click", (ev) => {
    if (ev.target === ui.root) finish(false);
  });
  document.addEventListener("keydown", (ev) => {
    if (!active || ev.key !== "Escape") return;
    ev.preventDefault();
    finish(false);
  });

  global.AppDialog = {
    confirm({ title, message, confirmLabel, cancelLabel, danger, tone }) {
      return enqueue({
        title: title || "Please confirm",
        message: message || "",
        confirmLabel: confirmLabel || "Continue",
        cancelLabel: cancelLabel || "Cancel",
        danger: !!danger,
        tone: tone || "warn",
      });
    },
    alert({ title, message, tone }) {
      return enqueue({
        title: title || "Notice",
        message: message || "",
        confirmLabel: "OK",
        cancelLabel: "",
        danger: false,
        tone: tone || "error",
      });
    },
  };
})(window);

/** IndexedDB persistence for the dentist clinic demo. */
(function (global) {

      name: "Dr. Priya Gupta",
      title: "Partner Dentist",
      avatar: assetUrl("doctor-priya.jpg"),

  ];

  // 10 male + 10 female Indian patient portraits.
  const PATIENT_AVATARS = {
    male: [
      "patient-01.jpg",
      "patient-03.jpg",
      "patient-05.jpg",
      "patient-08.jpg",
      "patient-10.jpg",

      "patient-16.jpg",
      "patient-18.jpg",
      "patient-20.jpg",
    ].map(assetUrl),
  };

  const ALL_PATIENT_AVATARS = [...PATIENT_AVATARS.male, ...PATIENT_AVATARS.female];

  const SAMPLE_PATIENTS = [
    { name: "Arjun Patel", address: "12 Lake View Road, Coimbatore", phone: "98765 43210", gender: "male", avatar: PATIENT_AVATARS.male[0] },
    { name: "Meera Iyer", address: "45 Race Course, Coimbatore", phone: "98200 11882", gender: "female", avatar: PATIENT_AVATARS.female[0] },
    { name: "Karthik Subramanian", address: "8 Avinashi Road, Coimbatore", phone: "94432 76001", gender: "male", avatar: PATIENT_AVATARS.male[1] },
    { name: "Sneha Reddy", address: "22 RS Puram, Coimbatore", phone: "90080 44521", gender: "female", avatar: PATIENT_AVATARS.female[1] },
    { name: "Vikram Joshi", address: "3 Peelamedu Cross, Coimbatore", phone: "99870 22334", gender: "male", avatar: PATIENT_AVATARS.male[2] },
  ];

  function pickPatientAvatar(gender, usedAvatars) {
    const g = gender === "female" ? "female" : "male";
    const gendered = PATIENT_AVATARS[g];
    const used = new Set(usedAvatars || []);
    const free = gendered.filter((a) => !used.has(a));
    const pool = free.length ? free : gendered;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("meta")) {
          db.createObjectStore("meta", { keyPath: "key" });
        }
        if (!db.objectStoreNames.contains("dentists")) {
          db.createObjectStore("dentists", { keyPath: "id" });
        }
        if (!db.objectStoreNames.contains("patients")) {
          db.createObjectStore("patients", { keyPath: "id" });
        }
        if (!db.objectStoreNames.contains("visits")) {
          const visits = db.createObjectStore("visits", { keyPath: "id" });
          visits.createIndex("byPatient", "patientId", { unique: false });
        }
        if (!db.objectStoreNames.contains("scans")) {
          const scans = db.createObjectStore("scans", { keyPath: "id" });
          scans.createIndex("byVisit", "visitId", { unique: false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function txDone(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error("transaction aborted"));
    });
  }

  function reqToPromise(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function getAll(storeName) {
    const db = await openDb();
    return reqToPromise(db.transaction(storeName).objectStore(storeName).getAll());
  }

  async function getById(storeName, id) {
    const db = await openDb();
    return reqToPromise(db.transaction(storeName).objectStore(storeName).get(id));
  }

  async function put(storeName, value) {
    const db = await openDb();
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).put(value);
    await txDone(tx);
    return value;
  }

  async function del(storeName, id) {
    const db = await openDb();
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).delete(id);
    await txDone(tx);
  }

  async function getMeta(key, fallback) {
    const row = await getById("meta", key);
    return row ? row.value : fallback;
  }

  async function setMeta(key, value) {
    return put("meta", { key, value });
  }

  function uid(prefix) {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
  }

  async function seedIfEmpty() {
    const dentists = await getAll("dentists");
    if (!dentists.length) {
      const db = await openDb();
      const tx = db.transaction("dentists", "readwrite");
      for (const d of SAMPLE_DENTISTS) tx.objectStore("dentists").put(d);
      await txDone(tx);
    } else {
      // Refresh sample dentist avatars/titles for existing demo DBs.
      const db = await openDb();
      const tx = db.transaction("dentists", "readwrite");
      for (const d of SAMPLE_DENTISTS) tx.objectStore("dentists").put(d);
      await txDone(tx);
    }

    const patients = await getAll("patients");
    if (!patients.length) {
      const now = Date.now();
      const db = await openDb();
      const tx = db.transaction(["patients", "meta"], "readwrite");
      SAMPLE_PATIENTS.forEach((p, i) => {
        const id = `P${String(i + 1).padStart(4, "0")}`;
        tx.objectStore("patients").put({
          id,
          name: p.name,
          address: p.address,
          phone: p.phone || "",
          gender: p.gender,
          avatar: p.avatar,
          firstVisitAt: now - (SAMPLE_PATIENTS.length - i) * 86400000,
        });
      });
      tx.objectStore("meta").put({ key: "patientSeq", value: SAMPLE_PATIENTS.length });
      await txDone(tx);
    } else {
      const seq = await getMeta("patientSeq", 0);
      if (!seq) {
        const max = patients.reduce((m, p) => {
          const n = Number(String(p.id).replace(/^P/i, ""));
          return Number.isFinite(n) ? Math.max(m, n) : m;
        }, 0);
        await setMeta("patientSeq", max);
      }
      const byName = Object.fromEntries(
        SAMPLE_PATIENTS.map((p) => [
          p.name,
          { avatar: p.avatar, gender: p.gender, phone: p.phone || "" },
        ])
      );
      for (const p of patients) {
        let changed = false;
        const sample = byName[p.name];
        if (sample) {
          if (p.avatar !== sample.avatar) {
            p.avatar = sample.avatar;
            changed = true;
          }
          if (p.gender !== sample.gender) {
            p.gender = sample.gender;
            changed = true;
          }
          if (!p.phone && sample.phone) {
            p.phone = sample.phone;
            changed = true;
          }
        } else {
          if (p.gender !== "male" && p.gender !== "female") {
            p.gender = PATIENT_AVATARS.female.includes(p.avatar) ? "female" : "male";
            changed = true;
          }
          if (!p.avatar || !ALL_PATIENT_AVATARS.includes(p.avatar)) {
            p.avatar = pickPatientAvatar(
              p.gender,
              patients.map((x) => x.avatar)
            );
            changed = true;
          }
        }
        if (changed) await put("patients", p);
      }
    }

    await backfillVisitDentistNames();
  }

  async function nextPatientId() {
    const seq = (await getMeta("patientSeq", 0)) + 1;
    await setMeta("patientSeq", seq);
    return `P${String(seq).padStart(4, "0")}`;
  }

  async function createPatient({ name, address, phone, gender }) {
    const g = gender === "female" ? "female" : "male";
    const existing = await getAll("patients");
    const usedSameGender = existing
      .filter((p) => p.gender === g)
      .map((p) => p.avatar);
    const id = await nextPatientId();
    const patient = {
      id,
      name: name.trim(),
      address: (address || "").trim(),
      phone: (phone || "").trim(),
      gender: g,
      avatar: pickPatientAvatar(g, usedSameGender),
      firstVisitAt: Date.now(),
    };
    await put("patients", patient);
    return patient;
  }

  async function listPatients() {
    const patients = await getAll("patients");
    patients.sort((a, b) => a.id.localeCompare(b.id));
    return patients;
  }

  async function listDentists() {
    return getAll("dentists");
  }

  async function listVisitsForPatient(patientId) {
    const db = await openDb();
    const idx = db.transaction("visits").objectStore("visits").index("byPatient");
    const visits = await reqToPromise(idx.getAll(patientId));
    visits.sort((a, b) => b.createdAt - a.createdAt);
    return visits;
  }

  async function createVisit({ patientId, dentistId, dentistName, notes, prescription }) {
    const visit = {
      id: uid("v"),
      patientId,
      dentistId,
      dentistName: dentistName || "",
      notes: notes || "",
      prescription: prescription || "",
      createdAt: Date.now(),
    };
    await put("visits", visit);
    return visit;
  }

  async function backfillVisitDentistNames() {
    const visits = await getAll("visits");
    const missing = visits.filter((v) => !v.dentistName && v.dentistId);
    if (!missing.length) return;
    const dentists = await getAll("dentists");
    const byId = Object.fromEntries(dentists.map((d) => [d.id, d]));
    for (const v of missing) {
      const d = byId[v.dentistId];
      if (!d) continue;
      v.dentistName = d.name;
      await put("visits", v);
    }
  }

  async function updateVisitNotes(visitId, notes, prescription) {
    const visit = await getById("visits", visitId);
    if (!visit) throw new Error("Visit not found");
    visit.notes = notes;
    visit.prescription = prescription || "";
    await put("visits", visit);
    return visit;
  }

  async function listScansForVisit(visitId) {
    const db = await openDb();
    const idx = db.transaction("scans").objectStore("scans").index("byVisit");
    const scans = await reqToPromise(idx.getAll(visitId));
    scans.sort((a, b) => b.createdAt - a.createdAt);
    return scans;
  }

  async function addScan({ visitId, patientId, dentistId, imageBlob, width, height }) {
    const scan = {
      id: uid("s"),
      visitId,
      patientId,
      dentistId,
      createdAt: Date.now(),
      imageBlob,
      width,
      height,
    };
    await put("scans", scan);
    return scan;
  }

  async function discardScan(scanId) {
    await del("scans", scanId);
  }

  global.ClinicDB = {
    seedIfEmpty,
    listDentists,
    getDentist: (id) => getById("dentists", id),
    listPatients,
    getPatient: (id) => getById("patients", id),
    createPatient,
    listVisitsForPatient,
    getVisit: (id) => getById("visits", id),
    createVisit,
    updateVisitNotes,
    listScansForVisit,
    addScan,
    discardScan,
    getScan: (id) => getById("scans", id),
    backfillVisitDentistNames,
  };
})(window);


/** Shared Hamamatsu sample download + dark/shading correction for Ics. */
(function (global) {
  const S3_BASE =
    "https://iatome-hamamatsu-xray-input-files.s3.ap-south-1.amazonaws.com";
  const KEYS = ["Idr", "Ido", "Ixr", "Ixo"];
  const HEADER_BYTES = 16;
  const WIDTH = 1000;
  const HEIGHT = 1506;
  const NPIXELS = WIDTH * HEIGHT;
  const EXPECTED_SIZE = HEADER_BYTES + NPIXELS * 2;
  const REF_EPS = 1;

  function parseFrameBuffer(buf, label) {
    if (buf.byteLength !== EXPECTED_SIZE) {
      throw new Error(
        `${label}: size ${buf.byteLength} bytes, expected ${EXPECTED_SIZE}`
      );
    }
    const u16 = new Uint16Array(buf, HEADER_BYTES, NPIXELS);
    const f32 = new Float32Array(NPIXELS);
    for (let i = 0; i < NPIXELS; i++) f32[i] = u16[i];
    return f32;
  }

  async function downloadSampleFrame(key) {
    const name = `${key}.bin`;
    const url = `${S3_BASE}/${name}`;
    const res = await fetch(url, { mode: "cors", cache: "no-store" });
    if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
    const buf = await res.arrayBuffer();
    return parseFrameBuffer(buf, name);
  }

  function darkCorrect(ix, idark) {
    const out = new Float32Array(NPIXELS);
    for (let i = 0; i < NPIXELS; i++) {
      const v = ix[i] - idark[i];
      out[i] = v > 0 ? v : 0;
    }
    return out;
  }

  function shadingCorrect(icdo, icdr) {
    let sum = 0;
    let n = 0;
    for (let i = 0; i < NPIXELS; i++) {
      if (icdr[i] > REF_EPS) {
        sum += icdr[i];
        n++;
      }
    }
    if (!n) throw new Error("no usable Icdr pixels");
    const C = sum / n;
    const ics = new Float32Array(NPIXELS);
    for (let i = 0; i < NPIXELS; i++) {
      ics[i] = icdr[i] > REF_EPS ? (C * icdo[i]) / icdr[i] : 0;
    }
    return { ics, C };
  }

  function percentileWindow(src) {
    const sampleN = Math.min(200000, src.length);
    const step = Math.max(1, Math.floor(src.length / sampleN));
    const sample = new Float32Array(sampleN);
    for (let i = 0; i < sampleN; i++) sample[i] = src[i * step];
    sample.sort();
    let lo = sample[Math.floor(sampleN * 0.01)];
    let hi = sample[Math.floor(sampleN * 0.99)];
    if (!(hi > lo)) hi = lo + 1;
    return { lo, hi };
  }

  function renderIcsToPngBlob(ics) {
    const { lo, hi } = percentileWindow(ics);
    const canvas = document.createElement("canvas");
    canvas.width = WIDTH;
    canvas.height = HEIGHT;
    const ctx = canvas.getContext("2d");
    const img = ctx.createImageData(WIDTH, HEIGHT);
    const d = img.data;
    const scale = 255 / (hi - lo);
    for (let i = 0; i < NPIXELS; i++) {
      let v = ics[i];
      if (v <= lo) v = 0;
      else if (v >= hi) v = 255;
      else v = (v - lo) * scale;
      const o = i * 4;
      const g = v | 0;
      d[o] = g;
      d[o + 1] = g;
      d[o + 2] = g;
      d[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return new Promise((resolve, reject) => {
      canvas.toBlob(
        (blob) => (blob ? resolve(blob) : reject(new Error("PNG encode failed"))),
        "image/png"
      );
    });
  }

  async function captureFinalXrayPng() {
    const frames = {};
    await Promise.all(
      KEYS.map(async (key) => {
        frames[key] = await downloadSampleFrame(key);
      })
    );
    const icdr = darkCorrect(frames.Ixr, frames.Idr);
    const icdo = darkCorrect(frames.Ixo, frames.Ido);
    const { ics, C } = shadingCorrect(icdo, icdr);
    const pngBlob = await renderIcsToPngBlob(ics);
    return { pngBlob, C, width: WIDTH, height: HEIGHT };
  }

  global.XrayPipeline = {
    WIDTH,
    HEIGHT,
    captureFinalXrayPng,
  };
})(window);


    function mountTemplate(id) {
      const app = document.getElementById('app');
      const tpl = document.getElementById(id);
      app.replaceChildren(tpl.content.cloneNode(true));
    }

    function wireHomeLinks() {
      document.querySelectorAll('[data-route]').forEach((el) => {
        el.addEventListener('click', (ev) => {
          ev.preventDefault();
          const route = el.getAttribute('data-route');
          location.hash = route;
        });
      });
    }

    function initDentist() {

    const DENTIST_SS_KEY = "alerio-clinic-dentist-id";
    const state = {
      dentist: null,
      patient: null,
      visit: null,
      objectUrls: [],
      screen: "dentists",
    };

    const screens = {
      dentists: document.getElementById("screenDentists"),
      patients: document.getElementById("screenPatients"),
      newPatient: document.getElementById("screenNewPatient"),
      patient: document.getElementById("screenPatient"),
      visit: document.getElementById("screenVisit"),
    };

    let syncing = false;

    function showScreen(name) {
      state.screen = name;
      for (const key of Object.keys(screens)) {
        screens[key].classList.toggle("hidden", key !== name);
      }
      renderBreadcrumbs(name);
    }

    function currentHashPath() {
      return (location.hash || "").replace(/^#/, "") || "home";
    }

    function go(path) {
      const next = String(path || "dentist").replace(/^#/, "");
      if (currentHashPath() === next) {
        syncFromHash(next);
        return;
      }
      location.hash = next;
    }

    function persistDentist(dentist) {
      if (dentist && dentist.id) sessionStorage.setItem(DENTIST_SS_KEY, dentist.id);
      else sessionStorage.removeItem(DENTIST_SS_KEY);
    }

    async function ensureDentist() {
      if (state.dentist) return state.dentist;
      const id = sessionStorage.getItem(DENTIST_SS_KEY);
      if (!id) return null;
      state.dentist = await ClinicDB.getDentist(id);
      return state.dentist;
    }

    function renderBreadcrumbs(screen) {
      const nav = document.getElementById("dentistBreadcrumbs");
      if (!nav) return;

      const dentistLabel = state.dentist ? state.dentist.name : "Dentist";
      const crumbs = [{ label: "Demo home", action: "home" }];

      if (screen === "dentists") {
        crumbs.push({ label: "Select dentist", current: true });
      } else {
        crumbs.push({ label: "Select dentist", action: "dentists" });
        crumbs.push({ label: dentistLabel, action: "patients" });

        if (screen === "patients") {
          crumbs.push({ label: "Patients", current: true });
        } else if (screen === "newPatient") {
          crumbs.push({ label: "Patients", action: "patients" });
          crumbs.push({ label: "New patient", current: true });
        } else if (screen === "patient") {
          crumbs.push({ label: "Patients", action: "patients" });
          crumbs.push({
            label: state.patient ? state.patient.name : "Patient",
            current: true,
          });
        } else if (screen === "visit") {
          crumbs.push({ label: "Patients", action: "patients" });
          crumbs.push({
            label: state.patient ? state.patient.name : "Patient",
            action: "patient",
          });
          crumbs.push({
            label: state.visit
              ? `Visit · ${fmtDate(state.visit.createdAt)}`
              : "Visit",
            current: true,
          });
        }
      }

      nav.innerHTML = "";
      crumbs.forEach((crumb, i) => {
        if (i > 0) {
          const sep = document.createElement("span");
          sep.className = "crumb-sep";
          sep.textContent = "/";
          sep.setAttribute("aria-hidden", "true");
          nav.appendChild(sep);
        }
        if (crumb.current) {
          const span = document.createElement("span");
          span.className = "crumb-current";
          span.textContent = crumb.label;
          span.setAttribute("aria-current", "page");
          nav.appendChild(span);
        } else {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = crumb.label;
          btn.addEventListener("click", () => navigateBreadcrumb(crumb.action));
          nav.appendChild(btn);
        }
      });
    }

    function navigateBreadcrumb(action) {
      if (action === "home") {
        location.hash = "home";
        return;
      }
      if (action === "dentists") {
        go("dentist");
        return;
      }
      if (action === "patients") {
        go("dentist/patients");
        return;
      }
      if (action === "patient" && state.patient) {
        go(`dentist/patient/${state.patient.id}`);
      }
    }

    function fmtDate(ts) {
      return new Date(ts).toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function fmtLastVisit(ts) {
      const d = new Date(ts);
      const now = new Date();
      const time = d.toLocaleString(undefined, {
        hour: "2-digit",
        minute: "2-digit",
      });
      if (
        d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate()
      ) {
        return `Today, ${time}`;
      }
      const opts = {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      };
      if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
      return d.toLocaleString(undefined, opts);
    }

    function toast(msg, cls) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = `toast ${cls || ""}`.trim();
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add("hidden"), 3200);
    }

    function setBusy(show, text) {
      document.getElementById("busyOverlay").classList.toggle("hidden", !show);
      if (text) document.getElementById("busyText").textContent = text;
    }

    function updateWho() {
      const el = document.getElementById("whoLine");
      if (!state.dentist) {
        el.textContent = "No dentist selected";
        return;
      }
      el.innerHTML = `
        <img class="avatar sm" alt="" src="${state.dentist.avatar || ""}" />
        <span>Signed in as <strong>${state.dentist.name}</strong></span>
      `;
    }

    function revokeObjectUrls() {
      for (const url of state.objectUrls) URL.revokeObjectURL(url);
      state.objectUrls = [];
    }

    async function renderDentists() {
      const grid = document.getElementById("dentistGrid");
      const dentists = await ClinicDB.listDentists();
      grid.innerHTML = "";
      for (const d of dentists) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dentist-card";
        btn.innerHTML = `
          <img class="avatar" alt="" src="${d.avatar || ""}" />
          <div>
            <div class="title">${d.title}</div>

        btn.addEventListener("click", () => {

        });

      }
    }

    async function renderPatients() {
      const body = document.getElementById("patientTableBody");
      const patients = await ClinicDB.listPatients();
      const startOfToday = new Date();
      startOfToday.setHours(0, 0, 0, 0);
      const todayStart = startOfToday.getTime();
      const rows = await Promise.all(
        patients.map(async (p) => {
          const visits = await ClinicDB.listVisitsForPatient(p.id);
          const lastVisitAt = visits.length
            ? Math.max(...visits.map((v) => v.createdAt))
            : 0;
          const createdAt = p.firstVisitAt || 0;
          const createdToday = createdAt >= todayStart;
          return { patient: p, lastVisitAt, createdAt, createdToday };
        })
      );
      rows.sort((a, b) => {
        if (a.createdToday !== b.createdToday) return a.createdToday ? -1 : 1;
        if (a.createdToday && b.createdToday) {
          if (b.createdAt !== a.createdAt) return b.createdAt - a.createdAt;
          return b.patient.id.localeCompare(a.patient.id);
        }
        if (b.lastVisitAt !== a.lastVisitAt) return b.lastVisitAt - a.lastVisitAt;
        return a.patient.id.localeCompare(b.patient.id);
      });
      body.innerHTML = "";
      for (const row of rows) {
        const p = row.patient;
        const tr = document.createElement("tr");
        tr.className = "patient-row";
        tr.innerHTML = `
          <td class="mono">${p.id}</td>
          <td>
            <div class="patient-name">
              <img class="avatar sm" alt="" src="${p.avatar || ""}" />
              <span>${p.name}</span>
            </div>
          </td>
          <td class="muted">${row.lastVisitAt ? fmtLastVisit(row.lastVisitAt) : "—"}</td>
        `;
        tr.addEventListener("click", () => go(`dentist/patient/${p.id}`));
        body.appendChild(tr);
      }
    }

            </div>

          `;

    async function openVisit(visitId) {
      state.visit = await ClinicDB.getVisit(visitId);
      if (!state.visit) return false;
      if (!state.patient || state.patient.id !== state.visit.patientId) {
        state.patient = await ClinicDB.getPatient(state.visit.patientId);
      }
      if (!state.patient) return false;
      let visitDoctor = state.visit.dentistName || "";
      if (!visitDoctor && state.visit.dentistId) {
        const recorded = await ClinicDB.getDentist(state.visit.dentistId);
        if (recorded) visitDoctor = recorded.name;
      }
      if (!visitDoctor) visitDoctor = "Doctor unknown";
      updateWho();
      document.getElementById("visitTitle").textContent = `Visit · ${state.patient.name}`;
      document.getElementById("visitChips").innerHTML = `
        <span class="chip mono">${state.patient.id}</span>
        <span class="chip">${fmtDate(state.visit.createdAt)}</span>
        <span class="chip">${visitDoctor}</span>
      `;
      document.getElementById("visitNotes").value = state.visit.notes || "";
      document.getElementById("visitPrescription").value = state.visit.prescription || "";
      await renderScans();
      showScreen("visit");
      return true;
    }

    function visitDetailsDirty() {
      if (state.screen !== "visit" || !state.visit) return false;
      const notesEl = document.getElementById("visitNotes");
      const prescriptionEl = document.getElementById("visitPrescription");
      if (!notesEl || !prescriptionEl) return false;
      return (
        notesEl.value !== (state.visit.notes || "") ||
        prescriptionEl.value !== (state.visit.prescription || "")
      );
    }

    async function confirmDiscardUnsavedVisit() {
      if (!visitDetailsDirty()) return true;
      return AppDialog.confirm({
        title: "Unsaved visit details",
        message:
          "You have unsaved changes to the visit notes or prescription.\n\nLeave this page without saving?",
        confirmLabel: "Leave without saving",
        cancelLabel: "Stay",
        danger: true,
      });
    }

    function restoreVisitHash() {
      if (!state.visit) return;
      const back = `#dentist/visit/${state.visit.id}`;
      if (location.hash !== back) history.replaceState(null, "", back);
    }

    async function confirmLeaveApp() {
      if (await confirmDiscardUnsavedVisit()) return true;
      restoreVisitHash();
      return false;
    }

    async function applyHash(hash, options) {
      const skipUnsaved = !!(options && options.skipUnsaved);
      const parts = String(hash || "dentist").replace(/^#/, "").split("/").filter(Boolean);
      if (parts[0] !== "dentist") return;

      const nextVisitId = parts[1] === "visit" ? parts[2] : null;
      if (
        !skipUnsaved &&
        state.screen === "visit" &&
        state.visit &&
        nextVisitId !== state.visit.id &&
        !(await confirmDiscardUnsavedVisit())
      ) {
        restoreVisitHash();
        return;
      }

      if (parts.length === 1) {
        state.dentist = null;
        state.patient = null;
        state.visit = null;
        persistDentist(null);
        updateWho();
        await renderDentists();
        showScreen("dentists");
        return;
      }

      const section = parts[1];
      if (section === "visit" && parts[2]) {
        if (state.screen === "visit" && state.visit && state.visit.id === parts[2]) return;
        const ok = await openVisit(parts[2]);
        if (!ok) {
          history.replaceState(null, "", "#dentist/patients");
          await applyHash("dentist/patients", { skipUnsaved: true });
        }
        return;
      }

      const dentist = await ensureDentist();
      if (!dentist) {
        history.replaceState(null, "", "#dentist");
        await applyHash("dentist", { skipUnsaved: true });
        return;
      }
      updateWho();

      if (section === "patients") {
        state.patient = null;
        state.visit = null;
        await renderPatients();
        showScreen("patients");
        return;
      }

      if (section === "new-patient") {
        state.patient = null;
        state.visit = null;
        document.getElementById("newPatientForm").reset();
        showScreen("newPatient");
        return;
      }

      if (section === "patient" && parts[2]) {
        const ok = await openPatient(parts[2]);
        if (!ok) {
          history.replaceState(null, "", "#dentist/patients");
          await applyHash("dentist/patients", { skipUnsaved: true });
        }
        return;
      }

      history.replaceState(null, "", "#dentist");
      await applyHash("dentist", { skipUnsaved: true });
    }

    async function syncFromHash(hash) {
      if (syncing) return;
      syncing = true;
      try {
        await applyHash(hash);
      } finally {
        syncing = false;
      }
    }

    async function renderScans() {
      revokeObjectUrls();
      const grid = document.getElementById("scanGrid");
      const empty = document.getElementById("scanEmpty");
      grid.innerHTML = "";
      const scans = await ClinicDB.listScansForVisit(state.visit.id);
      empty.classList.toggle("hidden", scans.length > 0);
      for (const scan of scans) {
        const url = URL.createObjectURL(scan.imageBlob);
        state.objectUrls.push(url);
        const card = document.createElement("div");
        card.className = "scan-card";
        card.innerHTML = `
