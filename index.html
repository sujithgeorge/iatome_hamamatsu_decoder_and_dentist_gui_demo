    function initHamamatsu() {

    let syncing = false;

    const S3_BASE =
      "https://iatome-hamamatsu-xray-input-files.s3.ap-south-1.amazonaws.com";
    const KEYS = ["Idr", "Ido", "Ixr", "Ixo"];
    const HEADER_BYTES = 16;
    const WIDTH = 1000;
    const HEIGHT = 1506;
    const NPIXELS = WIDTH * HEIGHT;
    const EXPECTED_SIZE = HEADER_BYTES + NPIXELS * 2;
    const REF_EPS = 1;

    const FRAME_HELP = {
      Idr: "Dark frame taken with X-rays off, used to remove detector offset from the open-beam reference.",
      Ido: "Dark frame taken with X-rays off, used to remove detector offset from the object exposure.",
      Ixr: "Open-beam X-ray image with no object in the beam, used as the shading / flat-field reference.",
      Ixo: "X-ray image of the object (phantom), the acquisition you want to dark- and shading-correct.",
    };

    const FINAL_STAGE = {
      key: "Ics",
      label: "Ics (Final Result)",
      desc: "Final shaded image: C × Icdo / Icdr",
    };
    const INTERMEDIATE_STAGES = [
      { key: "Idr", label: "Idr", desc: "Raw dark frame paired with the reference acquisition" },
      { key: "Ido", label: "Ido", desc: "Raw dark frame paired with the object acquisition" },
      { key: "Ixr", label: "Ixr", desc: "Raw open-beam X-ray (no phantom)" },
      { key: "Ixo", label: "Ixo", desc: "Raw object X-ray (phantom present)" },
      { key: "Icdr", label: "Icdr", desc: "Dark-corrected reference: Ixr − Idr" },
      { key: "Icdo", label: "Icdo", desc: "Dark-corrected object: Ixo − Ido" },
    ];

    /** @type {'none' | 'local' | 'sample'} */
    let sourceMode = "none";
    /** @type {Record<string, Float32Array | null>} */
    let frames = { Idr: null, Ido: null, Ixr: null, Ixo: null };
    /** @type {Record<string, string>} */
    let frameLabels = { Idr: "", Ido: "", Ixr: "", Ixo: "" };
    /** @type {Record<string, Float32Array> | null} */
    let sampleCache = null;
    /** @type {Record<string, Float32Array> | null} */
    let results = null;
    /** @type {Set<string>} */
    const downloadingKeys = new Set();

    const logEl = document.getElementById("log");
    const inputStage = document.getElementById("inputStage");
    const viewStage = document.getElementById("viewStage");
    const btnSample = document.getElementById("btnSample");
    const btnUploadMode = document.getElementById("btnUploadMode");
    const btnClear = document.getElementById("btnClear");
    const btnProcess = document.getElementById("btnProcess");
    const processHint = document.getElementById("processHint");
    const btnBack = document.getElementById("btnBack");
    const btnExplain = document.getElementById("btnExplain");
    const btnCloseExplain = document.getElementById("btnCloseExplain");
    const explainModal = document.getElementById("explainModal");
    const btnShowIntermediate = document.getElementById("btnShowIntermediate");
    const intermediateAccordion = document.getElementById("intermediateAccordion");
    const btnRetrySample = document.getElementById("btnRetrySample");
    const sampleRetry = document.getElementById("sampleRetry");
    const statusPanel = document.getElementById("statusPanel");
    const statusList = document.getElementById("statusList");
    const canvas = document.getElementById("canvas");
    const viewLabel = document.getElementById("viewLabel");
    const viewMeta = document.getElementById("viewMeta");
    const viewDisplay = document.getElementById("viewDisplay");
    const viewFinalButtonsEl = document.getElementById("viewFinalButtons");
    const viewIntermediateButtonsEl = document.getElementById("viewIntermediateButtons");
    /** @type {HTMLButtonElement[]} */
    let viewButtons = [];
    let processReadyAnnounced = false;
    let intermediateVisible = false;

    function setViewDisplayVisible(show) {
      viewDisplay.classList.toggle("hidden", !show);
    }

    function makeStageButton(stage) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.key = stage.key;
      btn.innerHTML = `
        <span class="stage-name">${stage.label}</span>
        <span class="stage-desc">${stage.desc}</span>
      `;
      btn.addEventListener("click", () => showView(stage.key));
      return btn;
    }

    function refreshViewButtonList() {
      viewButtons = [
        ...viewFinalButtonsEl.querySelectorAll("button"),
        ...viewIntermediateButtonsEl.querySelectorAll("button"),
      ];
    }

    function setIntermediateVisible(show) {
      intermediateVisible = show;
      intermediateAccordion.classList.toggle("open", show);
      viewIntermediateButtonsEl.classList.toggle("hidden", !show);
      btnShowIntermediate.setAttribute("aria-expanded", show ? "true" : "false");
      if (show) {
        setActiveViewButton(null);
        setViewDisplayVisible(false);
      }
    }

    function buildViewStageButtons() {
      viewFinalButtonsEl.innerHTML = "";
      viewIntermediateButtonsEl.innerHTML = "";
      viewFinalButtonsEl.appendChild(makeStageButton(FINAL_STAGE));
      for (const stage of INTERMEDIATE_STAGES) {
        viewIntermediateButtonsEl.appendChild(makeStageButton(stage));
      }
      refreshViewButtonList();
      setIntermediateVisible(false);
    }

    function log(msg, cls) {
      const line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = msg;
      if (logEl.textContent.startsWith("Ready.")) logEl.textContent = "";
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function mean(arr) {
      let s = 0;
      for (let i = 0; i < arr.length; i++) s += arr[i];
      return s / arr.length;
    }

    function allFramesReady() {
      return KEYS.every((k) => frames[k] instanceof Float32Array);
    }

    function updateProcessEnabled() {
      const ready = allFramesReady();
      btnProcess.classList.toggle("is-ready", ready);
      processHint.classList.toggle("visible", ready);
      if (ready && !processReadyAnnounced) {
        processReadyAnnounced = true;
        log(
          "All four frames are ready. Click the button below to continue.",
          "ok"
        );
      }
      if (!ready) processReadyAnnounced = false;
    }

    function setActiveViewButton(key) {
      for (const btn of viewButtons) {
        btn.classList.toggle("active", btn.dataset.key === key);
      }
    }

    function showInputStage() {
      viewStage.classList.add("hidden");
      viewStage.setAttribute("aria-hidden", "true");
      inputStage.classList.remove("hidden");
    }

    function showViewStage() {
      setIntermediateVisible(false);
      setViewDisplayVisible(true);
      inputStage.classList.add("hidden");
      viewStage.classList.remove("hidden");
      viewStage.setAttribute("aria-hidden", "false");
    }

    function currentHashPath() {
      return (location.hash || "").replace(/^#/, "") || "home";
    }

    function go(path, { replace = false } = {}) {
      const next = String(path || "hamamatsu").replace(/^#/, "");
      if (currentHashPath() === next) {
        syncFromHash(next);
        return;
      }
      if (replace) {
        history.replaceState(null, "", "#" + next);
        syncFromHash(next);
        return;
      }
      location.hash = next;
    }

    function clearResultsView() {
      results = null;
      setActiveViewButton(null);
      setIntermediateVisible(false);
      setViewDisplayVisible(true);
      viewLabel.textContent = "No image yet";
      viewMeta.textContent = "";
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      if (currentHashPath() === "hamamatsu/results") {
        go("hamamatsu", { replace: true });
      } else {
        showInputStage();
      }
    }

    async function syncFromHash(hash) {
      if (syncing) return;
      syncing = true;
      try {
        const parts = String(hash || "hamamatsu").replace(/^#/, "").split("/").filter(Boolean);
        if (parts[0] !== "hamamatsu") return;

        if (parts[1] === "results") {
          if (!results) {
            history.replaceState(null, "", "#hamamatsu");
            showInputStage();
            return;
          }
          showViewStage();
          showView("Ics");
          return;
        }

        showInputStage();
      } finally {
        syncing = false;
      }
    }

    function setChoiceSelected(mode) {
      btnSample.classList.toggle("selected", mode === "sample");
      btnUploadMode.classList.toggle("selected", mode === "local");
    }

    function showUploadUI(show) {
      statusPanel.classList.toggle("is-local", show);
    }

    function showStatusUI(show) {
      statusPanel.style.display = show ? "block" : "none";
      if (!show) hideSampleRetry();
    }

    function showSampleRetry(show) {
      sampleRetry.style.display = show ? "flex" : "none";
    }

    function hideSampleRetry() {
      showSampleRetry(false);
    }

    function applySampleToFrames(cache) {
      for (const key of KEYS) {
        frames[key] = cache[key];
        frameLabels[key] = `sample:${key}.bin`;
      }
    }

    function sampleCacheReady() {
      return !!(sampleCache && KEYS.every((k) => sampleCache[k]));
    }

    function refreshStatusList() {
      for (const key of KEYS) {
        const li = statusList.querySelector(`li[data-key="${key}"]`);
        if (!li) continue;
        const state = li.querySelector(".state");
        const spinner = li.querySelector(".spinner");
        const fileNameEl = li.querySelector(".file-name");
        const downloading = downloadingKeys.has(key);
        li.classList.toggle("ready", !!frames[key]);
        li.classList.remove("error");
        spinner.classList.toggle("on", downloading && !frames[key]);
        if (frames[key]) {
          state.className = "state ok";
          state.textContent =
            sourceMode === "sample" ? "ready (sample)" : "ready (local)";
          fileNameEl.textContent = frameLabels[key] || `${key}.bin`;
        } else if (downloading) {
          state.className = "state warn";
          state.textContent = "downloading…";
          fileNameEl.textContent = "No file selected";
        } else {
          state.className = "state warn";
          state.textContent = sourceMode === "none" ? "not loaded" : "missing";
          fileNameEl.textContent = "No file selected";
        }
      }

      updateProcessEnabled();
    }

    function resetFramesKeepMode() {
      for (const key of KEYS) {
        frames[key] = null;
        frameLabels[key] = "";
        const input = document.querySelector(`#file-${key}`);
        if (input) input.value = "";
      }
      clearResultsView();
      refreshStatusList();
    }

    function parseFrameBuffer(buf, label) {
      if (buf.byteLength !== EXPECTED_SIZE) {
        throw new Error(
          `${label}: size ${buf.byteLength} bytes, expected ${EXPECTED_SIZE}`
        );
      }
      const u16 = new Uint16Array(buf, HEADER_BYTES, NPIXELS);
      const f32 = new Float32Array(NPIXELS);
      for (let i = 0; i < NPIXELS; i++) f32[i] = u16[i];
      return f32;
    }

    async function loadLocalFile(key, file) {
      const buf = await file.arrayBuffer();
      return {
        data: parseFrameBuffer(buf, file.name || key),
        label: file.name || `${key}.bin`,
      };
    }

    async function downloadSampleFrame(key) {
      const name = `${key}.bin`;
      const url = `${S3_BASE}/${name}`;
      log(`GET ${url}`);
      const res = await fetch(url, { mode: "cors", cache: "no-store" });
      if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      return {
        data: parseFrameBuffer(buf, name),
        label: `sample:${name}`,
      };
    }

    function buildFrameCards() {
      statusList.innerHTML = "";
      for (const key of KEYS) {
        const li = document.createElement("li");
        li.dataset.key = key;
        li.innerHTML = `
          <div class="status-row">
            <span class="key">${key}</span>
            <span class="status-meta">
              <span class="spinner" aria-hidden="true"></span>
              <span class="state warn">not loaded</span>
            </span>
          </div>
          <div class="help">${FRAME_HELP[key]}</div>
          <div class="upload-actions">
            <label class="file-btn" for="file-${key}">Choose file</label>
            <input id="file-${key}" type="file" accept=".bin,application/octet-stream,*/*" />
            <span class="file-name">No file selected</span>
          </div>
        `;
        statusList.appendChild(li);

        const input = li.querySelector(`#file-${key}`);
        input.addEventListener("change", async () => {
          const file = input.files && input.files[0];
          if (!file) return;
          try {
            if (sourceMode !== "local") {
              throw new Error("Switch to “Upload my files” before choosing local files.");
            }
            const loaded = await loadLocalFile(key, file);
            frames[key] = loaded.data;
            frameLabels[key] = loaded.label;
            clearResultsView();
            log(
              `${key}: loaded “${loaded.label}” (mean=${mean(loaded.data).toFixed(1)})`,
              "ok"
            );
            refreshStatusList();
            if (!allFramesReady()) {
              const missing = KEYS.filter((k) => !frames[k]).join(", ");
              log(`Still missing: ${missing}`);
            }
          } catch (err) {
            frames[key] = null;
            frameLabels[key] = "";
            input.value = "";
            li.classList.add("error");
            const message = String(err.message || err);
            log(message, "bad");
            await AppDialog.alert({
              title: "Couldn’t load file",
              message,
              tone: "error",
            });
            refreshStatusList();
          }
        });
      }
    }

    function darkCorrect(ix, idark) {
      const out = new Float32Array(NPIXELS);
      for (let i = 0; i < NPIXELS; i++) {
        const v = ix[i] - idark[i];
        out[i] = v > 0 ? v : 0;
      }
      return out;
    }

    function shadingCorrect(icdo, icdr) {
      let sum = 0;
      let n = 0;
      for (let i = 0; i < NPIXELS; i++) {
        if (icdr[i] > REF_EPS) {
          sum += icdr[i];
          n++;
        }
      }
      if (!n) throw new Error("no usable Icdr pixels");
      const C = sum / n;
      const ics = new Float32Array(NPIXELS);
      for (let i = 0; i < NPIXELS; i++) {
        ics[i] = icdr[i] > REF_EPS ? (C * icdo[i]) / icdr[i] : 0;
      }
      return { ics, C };
    }

    function percentileWindow(src) {
      const sampleN = Math.min(200000, src.length);
      const step = Math.max(1, Math.floor(src.length / sampleN));
      const sample = new Float32Array(sampleN);
      for (let i = 0; i < sampleN; i++) sample[i] = src[i * step];
      sample.sort();
      let lo = sample[Math.floor(sampleN * 0.01)];
      let hi = sample[Math.floor(sampleN * 0.99)];
      if (!(hi > lo)) hi = lo + 1;
      return { lo, hi };
    }

    function renderToCanvas(src) {
      const { lo, hi } = percentileWindow(src);
      const ctx = canvas.getContext("2d");
      const img = ctx.createImageData(WIDTH, HEIGHT);
      const d = img.data;
      const scale = 255 / (hi - lo);
      for (let i = 0; i < NPIXELS; i++) {
        let v = src[i];
        if (v <= lo) v = 0;
        else if (v >= hi) v = 255;
        else v = (v - lo) * scale;
        const o = i * 4;
        const g = v | 0;
        d[o] = g;
        d[o + 1] = g;
        d[o + 2] = g;
        d[o + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      return { lo, hi };
    }

    async function showView(key) {
      const src = results && results[key];
      if (!src) {
        const message = `Nothing to show for ${key}. Run correction first.`;
        log(message, "bad");
        await AppDialog.alert({
          title: "Nothing to show",
          message,
          tone: "warn",
        });
        return;
      }
      if (key === "Ics" && intermediateVisible) {
        setIntermediateVisible(false);
      }
      setActiveViewButton(key);
      setViewDisplayVisible(true);
      const { lo, hi } = renderToCanvas(src);
      viewLabel.textContent = key;
      viewMeta.textContent =
        `mean=${mean(src).toFixed(1)}  ·  ` +
        `display window [${lo.toFixed(1)}, ${hi.toFixed(1)}]`;
      log(`Showing ${key}`, "ok");
    }

    btnUploadMode.addEventListener("click", () => {
      sourceMode = "local";
      setChoiceSelected("local");
      showUploadUI(true);
      showStatusUI(true);
      hideSampleRetry();
      resetFramesKeepMode();
      log("Upload mode: choose all 4 local files below.", "ok");
    });

    async function fetchSampleSetFromS3() {
      for (const key of KEYS) downloadingKeys.add(key);
      refreshStatusList();

      try {
        const loadedList = await Promise.all(
          KEYS.map(async (key) => {
            const loaded = await downloadSampleFrame(key);
            frames[key] = loaded.data;
            frameLabels[key] = loaded.label;
            downloadingKeys.delete(key);
            refreshStatusList();
            log(`${key}: sample ok  mean=${mean(loaded.data).toFixed(1)}`, "ok");
            return [key, loaded.data];
          })
        );

        const cache = {};
        for (const [key, data] of loadedList) cache[key] = data;
        sampleCache = cache;
      } finally {
        downloadingKeys.clear();
        refreshStatusList();
      }
    }

    function setSampleBusy(show) {
      const overlay = document.getElementById("sampleBusy");
      if (overlay) overlay.classList.toggle("hidden", !show);
    }

    async function loadSampleFromS3() {
      hideSampleRetry();
      btnSample.disabled = true;
      btnUploadMode.disabled = true;
      btnRetrySample.disabled = true;
      clearResultsView();
      for (const key of KEYS) downloadingKeys.add(key);
      resetFramesKeepMode();
      log("Loading sample set from S3…");
      setSampleBusy(true);

      try {
        await fetchSampleSetFromS3();
        hideSampleRetry();
        log("Sample set ready (4/4).", "ok");
      } catch (err) {
        setSampleBusy(false);
        downloadingKeys.clear();
        sampleCache = null;
        resetFramesKeepMode();
        showSampleRetry(true);
        const detail = String(err.message || err);
        log(detail, "bad");
        let hint = "Click Retry sample download to try again.";
        if (String(err).includes("Failed to fetch") || err.name === "TypeError") {
          hint = "The sample files could not be downloaded. Check that S3 allows GET from this page, then retry.";
          log(hint, "bad");
        }
        log("Sample download failed. Click Retry sample download.", "warn");
        await AppDialog.alert({
          title: "Sample download failed",
          message: `${detail}\n\n${hint}`,
          tone: "error",
        });
      } finally {
        setSampleBusy(false);
        btnSample.disabled = false;
        btnUploadMode.disabled = false;
        btnRetrySample.disabled = false;
        updateProcessEnabled();
      }
    }

    btnSample.addEventListener("click", async () => {
      sourceMode = "sample";
      setChoiceSelected("sample");
      showUploadUI(false);
      showStatusUI(true);
      clearResultsView();

      // Already downloaded earlier in this session: reuse cache.
      if (sampleCacheReady()) {
        hideSampleRetry();
        applySampleToFrames(sampleCache);
        for (const key of KEYS) {
          const input = document.querySelector(`#file-${key}`);
          if (input) input.value = "";
        }
        refreshStatusList();
        log("Using sample data already loaded in this session.", "ok");
        return;
      }

      await loadSampleFromS3();
    });

    btnRetrySample.addEventListener("click", async () => {
      sourceMode = "sample";
      setChoiceSelected("sample");
      showUploadUI(false);
      showStatusUI(true);
      await loadSampleFromS3();
    });

    btnClear.addEventListener("click", () => {
      sourceMode = "none";
      setChoiceSelected("none");
      showUploadUI(false);
      showStatusUI(false);
      hideSampleRetry();
      sampleCache = null;
      resetFramesKeepMode();
      logEl.textContent = "";
      log("Cleared inputs and downloaded sample files. Use sample data will re-download.", "ok");
    });

    function openExplainModal() {
      explainModal.classList.remove("hidden");
      explainModal.setAttribute("aria-hidden", "false");
      btnCloseExplain.focus();
    }

    function closeExplainModal() {
      explainModal.classList.add("hidden");
      explainModal.setAttribute("aria-hidden", "true");
    }

    btnExplain.addEventListener("click", openExplainModal);
    btnCloseExplain.addEventListener("click", closeExplainModal);
    explainModal.addEventListener("click", (ev) => {
      if (ev.target === explainModal) closeExplainModal();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && !explainModal.classList.contains("hidden")) {
        closeExplainModal();
      }
    });

    btnShowIntermediate.addEventListener("click", () => {
      const opening = !intermediateVisible;
      setIntermediateVisible(opening);
      if (opening) {
        log("Pick an intermediate step to display, or Ics (Final Result).", "ok");
      } else if (results) {
        showView("Ics");
      }
    });

    btnBack.addEventListener("click", () => {
      if (currentHashPath() === "hamamatsu/results") history.back();
      else go("hamamatsu", { replace: true });
      log("Back to inputs. Click “Process Frames and View Result” again to reopen the viewer.", "ok");
    });

    let processing = false;

    btnProcess.addEventListener("click", async () => {
      if (processing) return;
      if (sourceMode === "none") {
        const message = "Select “Use sample data” or “Upload my files” before processing.";
        log(message, "warn");
        await AppDialog.alert({
          title: "Choose an input source",
          message,
          tone: "warn",
        });
        return;
      }
      if (!allFramesReady()) {
        const message = sourceMode === "sample"
          ? (downloadingKeys.size
            ? "Sample data is still loading. Wait until all four frames are ready, then try again."
            : "Sample data is not ready. Choose “Use sample data” again, or retry the download.")
          : "Upload all four frames (Idr, Ido, Ixr, and Ixo) before processing.\n\nIf your intention is just to try out this tool, choose “Use sample data” instead. It loads a built-in set of all four frames.";
        log(message, "warn");
        await AppDialog.alert({
          title: "Frames not ready",
          message,
          tone: "warn",
        });
        return;
      }
      processing = true;
      try {
        const icdr = darkCorrect(frames.Ixr, frames.Idr);
        const icdo = darkCorrect(frames.Ixo, frames.Ido);
        const { ics, C } = shadingCorrect(icdo, icdr);
        results = {
          Idr: frames.Idr,
          Ido: frames.Ido,
          Ixr: frames.Ixr,
          Ixo: frames.Ixo,
          Icdr: icdr,
          Icdo: icdo,
          Ics: ics,
        };
        log(
          `Processed (${sourceMode}). C=${C.toFixed(3)}  Icdr mean=${mean(icdr).toFixed(1)}  Icdo mean=${mean(icdo).toFixed(1)}`,
          "ok"
        );
        go("hamamatsu/results");
      } catch (err) {
        const message = String(err.message || err);
        log(message, "bad");
        await AppDialog.alert({
          title: "Couldn’t process frames",
          message,
          tone: "error",
        });
        go("hamamatsu", { replace: true });
      } finally {
        processing = false;
        updateProcessEnabled();
      }
    });

    buildViewStageButtons();
    buildFrameCards();
    refreshStatusList();

    return { syncFromHash };
    }

    let routeRunning = false;
    let routeAgain = false;

    async function route() {
      if (routeRunning) {
        routeAgain = true;
        return;
      }
      routeRunning = true;
      try {
        do {
          routeAgain = false;
          await routeOnce();
        } while (routeAgain);
      } finally {
        routeRunning = false;
      }
    }

    async function routeOnce() {
      const hash = (location.hash || '#home').replace(/^#/, '') || 'home';
      const app = hash.split('/')[0] || 'home';

      if (app !== 'dentist' && window.__dentistCtl) {
        if (!(await window.__dentistCtl.confirmLeaveApp())) return;
        window.__dentistCtl = null;
      }

      if (app === 'dentist') {
        window.__hamamatsuCtl = null;
        const already =
          document.body.classList.contains('view-dentist') && window.__dentistCtl;
        if (!already) {
          document.body.classList.remove('view-home', 'view-dentist', 'view-hamamatsu');
          document.body.classList.add('view-dentist');
          document.title = 'ALERIO Dentist Workspace';
          mountTemplate('tpl-dentist');
          wireHomeLinks();
          window.__dentistCtl = initDentist();
          await window.__dentistCtl.ready;
        }
        await window.__dentistCtl.syncFromHash(hash);
        window.scrollTo(0, 0);
        return;
      }

      if (app === 'hamamatsu') {
        window.__dentistCtl = null;
        const already =
          document.body.classList.contains('view-hamamatsu') && window.__hamamatsuCtl;
        if (!already) {
          document.body.classList.remove('view-home', 'view-dentist', 'view-hamamatsu');
          document.body.classList.add('view-hamamatsu');
          document.title = 'Hamamatsu Decoding Pipeline';
          mountTemplate('tpl-hamamatsu');
          wireHomeLinks();
          window.__hamamatsuCtl = initHamamatsu();
        }
        await window.__hamamatsuCtl.syncFromHash(hash);
        window.scrollTo(0, 0);
        return;
      }

      window.__dentistCtl = null;
      window.__hamamatsuCtl = null;
      document.body.classList.remove('view-home', 'view-dentist', 'view-hamamatsu');
      document.body.classList.add('view-home');
      document.title = 'ALERIO Clinic Demo';
      mountTemplate('tpl-home');
      wireHomeLinks();
      window.scrollTo(0, 0);
    }

    window.addEventListener('hashchange', () => { route(); });
    route();
  </script>
</body>
</html>
